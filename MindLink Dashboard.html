<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<title>MindLink Dashboard</title>
<meta name="viewport" content="width=1440"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet"/>
<style>
  html, body, #root { height: 100%; margin: 0; padding: 0; }
  body { font-family: "DM Sans", system-ui, -apple-system, sans-serif; background: #F5F5F5; color: #374151; -webkit-font-smoothing: antialiased; }
  *, *::before, *::after { box-sizing: border-box; }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- Premium animations ---------- */
  @keyframes ml-fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes ml-fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes ml-pop { 0% { transform: scale(.9); opacity: 0; } 60% { transform: scale(1.04); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes ml-slideRight { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
  @keyframes ml-grow { from { width: 0; } }
  @keyframes ml-pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(78,205,196,0.45); } 50% { box-shadow: 0 0 0 10px rgba(78,205,196,0); } }
  @keyframes ml-shimmer { 0% { background-position: -200px 0; } 100% { background-position: 200px 0; } }
  @keyframes ml-glow { 0%,100% { filter: drop-shadow(0 0 0 rgba(255,255,255,0)); } 50% { filter: drop-shadow(0 0 8px rgba(255,255,255,0.4)); } }

  /* Page-level enter */
  .ml-page-enter { animation: ml-fadeUp .45s cubic-bezier(.2,.7,.2,1) both; }
  .ml-stagger > * { animation: ml-fadeUp .5s cubic-bezier(.2,.7,.2,1) both; }
  .ml-stagger > *:nth-child(1) { animation-delay: .04s; }
  .ml-stagger > *:nth-child(2) { animation-delay: .10s; }
  .ml-stagger > *:nth-child(3) { animation-delay: .16s; }
  .ml-stagger > *:nth-child(4) { animation-delay: .22s; }
  .ml-stagger > *:nth-child(5) { animation-delay: .28s; }

  /* Hover lift on cards/rows */
  .ml-lift { transition: transform .25s cubic-bezier(.2,.7,.2,1), box-shadow .25s; }
  .ml-lift:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,0.08); }

  /* Sidebar nav slide accent */
  .ml-nav-btn { position: relative; overflow: hidden; }
  .ml-nav-btn::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; background: #4ECDC4; border-radius: 2px; transform: scaleY(0); transform-origin: center; transition: transform .25s cubic-bezier(.34,1.56,.64,1); }
  .ml-nav-btn--active::before { transform: scaleY(1); }

  /* Number ticker (used by score cards) */
  .ml-num { display: inline-block; }

  /* Bar grow */
  .ml-bar-fill { animation: ml-grow .9s cubic-bezier(.2,.7,.2,1) both; }

  /* Kanban card move flash */
  .kanban-card { animation: ml-pop .35s cubic-bezier(.34,1.56,.64,1); }
  .kanban-card--moved { animation: ml-pop .5s cubic-bezier(.34,1.56,.64,1), ml-pulse 1.2s ease-out; }

  /* Login */
  @keyframes ml-orb-1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(30px,-20px) scale(1.1); } }
  @keyframes ml-orb-2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-25px,15px) scale(1.05); } }
  @keyframes ml-orb-3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(15px,25px) scale(.95); } }
  .ml-orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.55; pointer-events: none; }

  .ml-input { transition: border-color .2s, box-shadow .2s, background .2s; }
  .ml-input:focus { border-color: #1A8A7D !important; box-shadow: 0 0 0 4px rgba(26,138,125,0.12) !important; outline: none; }

  .ml-btn-primary { position: relative; overflow: hidden; transition: transform .15s, box-shadow .25s; }
  .ml-btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 20px rgba(26,138,125,0.25); }
  .ml-btn-primary:active { transform: translateY(0); }

  /* Spinner */
  @keyframes ml-spin { to { transform: rotate(360deg); } }
  .ml-spin { animation: ml-spin .9s linear infinite; }

  /* Login logo entry */
  .ml-logo-enter { animation: ml-pop .7s cubic-bezier(.34,1.56,.64,1) both; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
